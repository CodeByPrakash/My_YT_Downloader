<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download YouTube Video</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>My YT Downloader</h1>
        </header>
        
        <main class="main-content">
            <div class="form-container">
                <form id="input-form" method="POST" action="/">
                    <div class="form-group">
                        <label for="url">Enter YouTube URL</label>
                        <input type="text" name="url" id="url" placeholder="https://www.youtube.com/watch?v=..." required>
                    </div>

                    <div class="form-group">
                        <label for="format">Select Format</label>
                        <select name="format" id="format">
                            <option value="NULL" disabled selected>Choose format</option>
                            <option value="mp4">MP4 🎬</option>
                            <option value="mp3">MP3 🎧</option>
                        </select>
                    </div>

                    <div id="resolution-section" class="form-group" style="display:none;">
                        <label for="resolution">Choose Resolution</label>
                        <select name="resolution" id="resolution-box"></select>
                    </div>

                    <div class="button-group">
                        <button type="submit" id="submit-button" class="btn btn-primary"><i class='bx bxs-send'></i> Get Video</button>
                        <button type="button" id="clear-button" class="btn btn-secondary"><i class='bx bxs-trash-alt'></i> Clear</button>
                    </div>
                </form>
            </div>

            <div class="result-container">
                {% if title %}
                    <div class="video-info">
                        <h2>{{ title }}</h2>
                        {% if thumbnail_url %}
                            <img src="{{ thumbnail_url }}" alt="Thumbnail of {{ title }}">
                        {% endif %}
                        <form action="/download" id="download-form" method="POST">
                            <input type="hidden" name="url" value="{{ url }}">
                            <input type="hidden" name="format" value="{{ format_choice }}">
                            <input type="hidden" name="title" value="{{ title }}">
                            {% if format_choice == 'mp4' and resolution %}
                                <input type="hidden" name="resolution" value="{{ resolution }}">
                            {% endif %}
                            <button type="submit" id="download-button" class="btn btn-download">
                                <i class='bx bxs-download'></i> Download
                            </button>
                        </form>
                    </div>
                {% else %}
                    <div class="placeholder">
                        <p>Your video preview will appear here.</p>
                    </div>
                {% endif %}
                
                <div class="download-progress" id="download-progress" style="display:none;">
                    <div class="progress-header">
                        <span id="progress-label">Preparing download…</span>
                        <span id="progress-percent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="progress-subtext" id="progress-subtext">This may take a moment.</div>
                </div>
                <div class="download-error" id="download-error" style="display:none;"></div>
            </div>
        </main>
    </div>

<script>
    async function fetchResolutions() {
    const url = document.getElementById('url').value;
    const format = document.getElementById('format').value;
    const resSelect = document.getElementById('resolution-box');
    const resSection = document.getElementById('resolution-section');

    if (format === 'mp4' && url) {
        resSection.style.display = 'block';
        resSelect.innerHTML = '<option>Loading...</option>';
        try {
            const response = await fetch('/resolutions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });
            const data = await response.json();
            resSelect.innerHTML = '';
            if (data.resolutions) {
                data.resolutions.forEach(res => {
                    const opt = document.createElement('option');
                    opt.value = res;
                    opt.text = res;
                    resSelect.appendChild(opt);
                });
            } else if (data.error) {
                alert("Error: " + data.error);
                resSection.style.display = 'none';
            }
        } catch (err) {
            alert("Failed to fetch resolutions: " + err);
            resSection.style.display = 'none';
        }
    } else {
        resSelect.innerHTML = '';
        resSection.style.display = 'none';
    }
}

document.getElementById('format').addEventListener('change', fetchResolutions);
document.getElementById('url').addEventListener('input', () => {
    if (document.getElementById('format').value === 'mp4') {
        fetchResolutions();
    }
});

document.getElementById('input-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    const container = document.querySelector('.result-container');
    container.innerHTML = '<div class="placeholder"><p>Loading...</p></div>';

    try {
        const response = await fetch('/', { method: 'POST', body: formData });
        const html = await response.text();
        const tempDoc = new DOMParser().parseFromString(html, 'text/html');
        const newResult = tempDoc.querySelector('.result-container');
        if (newResult) {
            container.innerHTML = newResult.innerHTML;
            attachDownloadHandler();
        } else {
            container.innerHTML = '<div class="placeholder"><p>Error loading preview.</p></div>';
        }
    } catch (err) {
        alert("Error submitting form: " + err);
        container.innerHTML = '<div class="placeholder"><p>Something went wrong.</p></div>';
    }
});

function attachDownloadHandler() {
    const downloadForm = document.getElementById('download-form');
    if (!downloadForm) return;

    downloadForm.addEventListener('submit', async (evt) => {
        evt.preventDefault();
        const progress = document.getElementById('download-progress');
        const errorBox = document.getElementById('download-error');
        const progressFill = document.getElementById('progress-fill');
        const progressPercent = document.getElementById('progress-percent');
        const progressLabel = document.getElementById('progress-label');
        const progressSubtext = document.getElementById('progress-subtext');

        progress.style.display = 'block';
        errorBox.style.display = 'none';
        progressFill.style.width = '0%';
        progressPercent.textContent = '0%';
        progressLabel.textContent = 'Starting download…';
        progressSubtext.textContent = 'Requesting media stream.';

        const formData = new FormData(downloadForm);
        try {
            const response = await fetch('/download', { method: 'POST', body: formData });
            if (!response.ok) throw new Error('Server returned ' + response.status);

            const contentLength = response.headers.get('content-length');
            const totalBytes = contentLength ? parseInt(contentLength, 10) : null;
            const disposition = response.headers.get('content-disposition') || '';
            const filename = parseFilename(disposition) || 'download';

            if (!response.body) {
                const blob = await response.blob();
                triggerDownload(blob, filename);
                finalizeProgress(100, 'Download complete');
                return;
            }

            const reader = response.body.getReader();
            const chunks = [];
            let received = 0;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                received += value.length;
                updateProgress(received, totalBytes);
            }
            const blob = new Blob(chunks);
            triggerDownload(blob, filename);
            finalizeProgress(100, 'Download complete');
        } catch (error) {
            showError(error.message || 'Download failed');
            progress.style.display = 'none';
        }
    });
}

function updateProgress(received, total) {
    const fillEl = document.getElementById('progress-fill');
    const percentEl = document.getElementById('progress-percent');
    const labelEl = document.getElementById('progress-label');
    const subtextEl = document.getElementById('progress-subtext');
    
    if (!total) {
        fillEl.classList.add('indeterminate');
        percentEl.textContent = '…';
        labelEl.textContent = 'Downloading…';
        subtextEl.textContent = 'Size unknown, please wait.';
        return;
    }
    const pct = Math.min(100, Math.round((received / total) * 100));
    fillEl.classList.remove('indeterminate');
    fillEl.style.width = pct + '%';
    percentEl.textContent = pct + '%';
    labelEl.textContent = 'Downloading…';
    subtextEl.textContent = `${formatBytes(received)} of ${formatBytes(total)}`;
}

function finalizeProgress(pct, message) {
    const fillEl = document.getElementById('progress-fill');
    const percentEl = document.getElementById('progress-percent');
    const labelEl = document.getElementById('progress-label');
    const subtextEl = document.getElementById('progress-subtext');

    fillEl.classList.remove('indeterminate');
    fillEl.style.width = pct + '%';
    percentEl.textContent = pct + '%';
    labelEl.textContent = message;
    subtextEl.textContent = 'You can close this after the save prompt.';
}

function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}

function parseFilename(disposition) {
    const match = /filename\*=UTF-8''([^;]+)|filename="?([^";]+)"?/i.exec(disposition);
    return match ? decodeURIComponent(match[1] || match[2]) : null;
}

function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return `${parseFloat((bytes / Math.pow(1024, i)).toFixed(2))} ${units[i]}`;
}

function showError(message) {
    const el = document.getElementById('download-error');
    el.textContent = message;
    el.style.display = 'block';
}

document.getElementById('clear-button').addEventListener('click', () => {
    document.getElementById('input-form').reset();
    document.getElementById('resolution-section').style.display = 'none';
    document.querySelector('.result-container').innerHTML = '<div class="placeholder"><p>Your video preview will appear here.</p></div>';
});

// Initial attach on page load
attachDownloadHandler();
</script>
</body>
</html>
